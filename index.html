  #tlNow::before { content: ''; position: absolute; left: -.5px; width: 1px; top: -4px; height: 13px; background: #fff; }
  #tlNow span { position: absolute; top: 9px; left: 0; transform: translateX(-50%); padding: 3px 7px; border-radius: 999px; background: #fff; color: #15161a; font-size: 11px; font-weight: 600; letter-spacing: .02em; font-variant-numeric: tabular-nums; white-space: nowrap; box-shadow: 0 1px 6px rgba(0,0,0,.35); }
  #slider { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; -webkit-appearance: none; appearance: none; }

<script id="skyFrag" type="x-shader/x-fragment">
uniform vec3 uSunDir;
uniform vec3 uMoonDir;
uniform float uMoonPhase;
uniform float uT;
uniform float uCloud;
uniform float uC;   // reloj de las nubes, en segundos
uniform float uRain;
varying vec3 vDir;

float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);
}
float fbm(vec2 p){
  float a = .5, s = 0.;
  for(int i=0;i<6;i++){ s += a*noise(p); p = p*2.03+vec2(17.1,9.2); a *= .5; }
  return s;
}
float fbm3(vec2 p){
  float a = .5, s = 0.;
  for(int i=0;i<3;i++){ s += a*noise(p); p = p*2.03+vec2(17.1,9.2); a *= .5; }
  return s;
}
float stars(vec3 d){
  vec2 g = vec2(atan(d.x, -d.z), asin(d.y))*110.;
  vec2 id = floor(g), f = fract(g)-.5;
  float r = hash(id);
  vec2 o = vec2(hash(id+3.1), hash(id+7.7))-.5;
  float s = smoothstep(0.10, 0., length(f-o*.7))*step(0.80, r);
  s *= .65+.35*sin(uT*(1.+r*3.)+r*60.);
  return s*(0.35+0.65*hash(id+1.3));
}

void main(){
  vec3 d = normalize(vDir);
  d.y = max(d.y, 0.0);
  d = normalize(d);
  float el = asin(d.y);
  float sE = asin(clamp(uSunDir.y, -1., 1.));
  float day = smoothstep(-0.20, 0.10, sE);
  float tw = exp(-pow(sE/(sE > 0. ? 0.22 : 0.14), 2.));
  float night = 1.-smoothstep(-0.24, -0.08, sE);
  float glowVis = smoothstep(-0.20, 0.0, sE)*mix(1.0, 0.7, day);
  vec3 sunC = mix(vec3(1.0,0.45,0.15), vec3(1.0,0.95,0.85), smoothstep(0., 0.35, sE));

  float cs = clamp(dot(d, uSunDir), -1., 1.);
  float toward = pow(cs*.5+.5, 3.);
  float e = clamp(el/0.60, 0., 1.);
  float h = pow(1.-e, 2.2);

  vec3 zen = mix(vec3(0.022,0.034,0.085), vec3(0.13,0.33,0.72), day);
  vec3 hor = mix(vec3(0.070,0.100,0.185), vec3(0.74,0.85,0.93), day);
  vec3 c = mix(zen, hor, h);
  float glow = 0.42+0.58*smoothstep(-0.18, 0.03, sE);
  // Atardecer: franja rojo-anaranjada pegada al horizonte, que sube a naranja, amarillo melocotón y crema,
  // y acaba en azul grisáceo. Lejos del sol el horizonte es rosa apagado. Sin malvas saturados.
  float wide = pow(cs*.5+.5, 1.6);
  vec3 s0 = mix(vec3(1.00,0.34,0.10), vec3(1.00,0.56,0.22), smoothstep(0.02, 0.20, sE));
  vec3 warmC = mix(s0, vec3(1.00,0.60,0.24), smoothstep(0.0, 0.07, e));
  warmC = mix(warmC, vec3(0.99,0.80,0.50), smoothstep(0.05, 0.22, e));
  warmC = mix(warmC, vec3(0.76,0.75,0.72), smoothstep(0.18, 0.50, e));
  warmC = mix(warmC, vec3(0.42,0.50,0.64), smoothstep(0.40, 1.0, e));
  vec3 coolC = mix(vec3(0.62,0.50,0.54), vec3(0.56,0.57,0.66), smoothstep(0.0, 0.25, e));
  coolC = mix(coolC, vec3(0.42,0.50,0.64), smoothstep(0.20, 0.90, e));
  vec3 tc = mix(coolC, warmC, wide);
  tc *= mix(1.0, 0.50+0.50*smoothstep(-0.14, 0.02, sE), smoothstep(0.10, 0.60, e));   // tras la puesta, lo alto se apaga antes
  vec3 g0 = mix(vec3(0.62,0.50,0.54), s0, wide);
  c = mix(c, tc*glow, tw*0.9*mix(1.0, 0.60, e*smoothstep(0.0, 0.2, sE)));

  c += vec3(0.9,0.95,1.0)*stars(d)*night*(1.-h*0.7)*1.5;

  float ang = acos(cs);
  c += sunC*glowVis*(exp(-ang*ang/0.06)*0.14+exp(-ang*ang/0.004)*0.32);
  float disk = 1.-smoothstep(0.017, 0.021, ang);

  float moonDisk = 0.;
  if(uMoonDir.y > -0.06){
    float am = acos(clamp(dot(d, uMoonDir), -1., 1.));
    vec3 mr = normalize(cross(vec3(0., 1., 0.), uMoonDir));
    vec3 mu = cross(uMoonDir, mr);
    vec2 q = vec2(dot(d, mr), dot(d, mu))/0.021;
    float inD = (1.-smoothstep(0.90, 1.0, length(q)))*step(0.9, dot(d, uMoonDir));
    float term = (1.-2.*uMoonPhase)*sqrt(max(0., 1.-q.y*q.y));
    float lit = smoothstep(term-0.08, term+0.08, q.x);
    c += vec3(0.93,0.95,1.0)*exp(-am*am/0.012)*0.10*uMoonPhase*(1.-day);
    moonDisk = inD*lit*(1.-day*0.8)*(0.82+0.18*noise(q*2.5+3.));
  }

  // ---- nubes: dos capas con luz propia ----
  vec2 cp = d.xz/(d.y+0.13)*1.15;
  vec2 sp = uSunDir.xz/(max(uSunDir.y, 0.)+0.13)*1.15;
  vec2 ld = normalize(sp-cp+1e-4);
  float horizFade = smoothstep(0., 0.05, el+0.01);
  // tras la puesta, las nubes altas siguen encendidas un rato más que las bajas
  float lowLit = smoothstep(-0.13, -0.01, sE), highLit = smoothstep(-0.24, -0.07, sE);
  vec3 warm = mix(vec3(1.0,0.40,0.30), vec3(1.0,0.80,0.50), smoothstep(-0.04, 0.16, sE));
  vec3 litCol = mix(warm, vec3(1.0,0.99,0.96), smoothstep(0.10, 0.40, sE));
  vec3 shade = mix(mix(vec3(0.060,0.075,0.130), vec3(0.50,0.55,0.64), day), vec3(0.37,0.29,0.41), tw*0.85);
  float moonUp = smoothstep(0.0, 0.2, uMoonDir.y)*uMoonPhase*(1.-day);

  // capa alta: altocúmulos y cirros
  vec2 hp = cp*vec2(2.6, 3.4)+uC*vec2(0.016, -0.007);
  hp += 0.35*vec2(fbm3(hp*0.7+11.+uC*vec2(0.004, 0.006)), fbm3(hp*0.7+17.-uC*vec2(0.005, 0.003)));
  float hn = fbm3(hp);
  float hi = smoothstep(uCloud+0.05, uCloud+0.30, hn+0.30*fbm3(cp*0.25+31.+uC*vec2(0.002, -0.001))-0.10)*0.8*horizFade;
  vec3 hiCol = mix(shade*1.25, litCol, highLit*(0.55+0.45*smoothstep(0.40, 0.70, hn)));
  hiCol += warm*toward*0.30*highLit*tw+vec3(0.10,0.12,0.18)*moonUp;

  // capa baja: bancos de cúmulos con relieve, núcleo en sombra y borde encendido
  vec2 cq = cp*0.9+uC*vec2(0.0100, 0.0032);
  float bank = (fbm3(cq*0.30+50.+uC*vec2(-0.0012, 0.0016))-0.44)*0.45;
  vec2 wq = cq+0.6*vec2(fbm3(cp*1.17+3.+uC*vec2(0.0150, -0.0050)), fbm3(cp*1.17+9.+uC*vec2(-0.0060, 0.0170)));
  float bil = abs(noise(wq*5.+uC*vec2(0.020, 0.013))*2.-1.)*0.6+abs(noise(wq*11.-uC*vec2(0.028, 0.017))*2.-1.)*0.4;
  float dn = fbm(wq)+bank-0.10*bil;
  float cl = smoothstep(uCloud, uCloud+0.20, dn)*horizFade;
  float thick = smoothstep(uCloud+0.05, uCloud+0.40, dn);
  float sh = max(fbm3(wq+ld*0.16)+0.05+bank-uCloud, 0.)+max(fbm3(wq+ld*0.38)+0.05+bank-uCloud, 0.);
  float T = exp(-sh*mix(2.2, 4.0, smoothstep(0.0, 0.3, sE)))*mix(1.0, 0.75, thick);
  vec3 lowCol = mix(shade, litCol, T*lowLit)+vec3(0.10,0.12,0.18)*T*moonUp;
  lowCol += sunC*cl*(1.-cl)*4.*pow(toward, 4.)*glowVis*0.8;
  // perspectiva aérea: las nubes lejanas toman el color del horizonte
  float aer = pow(1.-e, 3.);
  lowCol = mix(lowCol, c, 0.60*aer);
  hiCol = mix(hiCol, c, 0.50*aer);

  c = mix(c, hiCol, hi*(1.-cl));
  c = mix(c, lowCol, cl*0.95);

  // cielo cubierto de lluvia: techo gris con relieve, más claro hacia el horizonte
  if(uRain > 0.001){
    float ov = fbm(cq*0.7+uC*vec2(0.006, 0.002));
    vec3 oc = mix(vec3(0.38,0.41,0.45), vec3(0.64,0.66,0.69), smoothstep(0.30, 0.70, ov));
    oc = mix(oc, vec3(0.55,0.575,0.61), pow(1.-e, 2.)*0.80);
    oc *= mix(0.10, 1.0, day)*mix(1.0, 0.8, tw);
    c = mix(c, oc, uRain*0.97);
  }

  vec3 lin = pow(max(c, 0.), vec3(2.2));
  vec3 diskC = mix(vec3(1.0,0.40,0.10), vec3(1.0,0.96,0.88), smoothstep(0., 0.30, sE));
  lin += diskC*disk*(1.-cl*0.85)*mix(6., 28., smoothstep(0., 0.3, sE))*(1.-uRain);
  lin = mix(lin, vec3(0.93,0.95,1.0)*1.6, moonDisk*(1.-cl*0.8)*(1.-uRain));
  gl_FragColor = vec4(lin, 1.);
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { Water } from './assets/vendor/Water.js?v=64';
import { createBirds } from './birds.js?v=64';
import { createSound } from './sound.js?v=2';
import { createSurface } from './surface.js?v=64';

const LAT = 39.33 * Math.PI / 180, LON = -0.35;       // L'Albufera
// Semilla fija: la orilla es siempre la misma en cada visita
let reseed;
{ let a = 20270615; reseed = n => { a = 20270615 + n * 7919; }; Math.random = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rad = d => d * Math.PI / 180;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rnd = (a, b) => a + Math.random() * (b - a);
const mix = (a, b, t) => a + (b - a) * t;
const mix3 = (a, b, t) => [mix(a[0], b[0], t), mix(a[1], b[1], t), mix(a[2], b[2], t)];

// ---------- astronomía ----------
function altAz(ra, dec, d) {
  const lst = rad(((18.697374558 + 24.06570982441908 * d) * 15 + LON) % 360);
  const ha = lst - ra;
  const el = Math.asin(Math.sin(LAT) * Math.sin(dec) + Math.cos(LAT) * Math.cos(dec) * Math.cos(ha));
  const az = Math.atan2(Math.sin(ha), Math.cos(ha) * Math.sin(LAT) - Math.tan(dec) * Math.cos(LAT)) + Math.PI;
  return { az, el };
}
function sky(date) {
  const d = date.getTime() / 86400000 + 2440587.5 - 2451545.0;
  const e = rad(23.439 - 0.00000036 * d);
  const g = rad(357.529 + 0.98560028 * d);
  const sl = rad(280.459 + 0.98564736 * d) + rad(1.915) * Math.sin(g) + rad(0.020) * Math.sin(2 * g);
  const sun = altAz(Math.atan2(Math.cos(e) * Math.sin(sl), Math.cos(sl)), Math.asin(Math.sin(e) * Math.sin(sl)), d);
  const ml = rad(218.316 + 13.176396 * d) + rad(6.289) * Math.sin(rad(134.963 + 13.064993 * d));
  const mb = rad(5.128) * Math.sin(rad(93.272 + 13.229350 * d));
  const moon = altAz(
    Math.atan2(Math.sin(ml) * Math.cos(e) - Math.tan(mb) * Math.sin(e), Math.cos(ml)),
    Math.asin(Math.sin(mb) * Math.cos(e) + Math.cos(mb) * Math.sin(e) * Math.sin(ml)), d);
  moon.phase = (1 - Math.cos(ml - sl)) / 2;
  return { sun, moon };
}

// ---------- hora de la escena (siempre en horario de Valencia) ----------
const fmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Madrid', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
function valenciaMinutes(date) {
  const p = Object.fromEntries(fmt.formatToParts(date).map(x => [x.type, +x.value]));
  return (p.hour % 24) * 60 + p.minute + p.second / 60;
}
let real = true, fast = false, simMin = valenciaMinutes(new Date());
const dateAtMinute = m => new Date(Date.now() + (m - valenciaMinutes(new Date())) * 60000);
const sceneDate = () => real ? new Date() : dateAtMinute(simMin);

// La cámara mira hacia donde hoy se pone el sol
let camAz = rad(265);
for (let m = 720, prev = 1; m < 1440; m += 2) {
  const s = sky(dateAtMinute(m)).sun;
  if (prev > 0 && s.el <= 0) { camAz = s.az - 0.07; break; }
  prev = s.el;
}
// Mundo: la cámara mira hacia -Z; +X queda a la derecha
const dirOf = (az, el, out) => out.set(Math.sin(az - camAz) * Math.cos(el), Math.sin(el), -Math.cos(az - camAz) * Math.cos(el));

const slider = document.getElementById('slider'), clock = document.getElementById('clock');
const btnNow = document.getElementById('btnNow'), btnFast = document.getElementById('btnFast');
function setMode(r, f) {
  real = r; fast = f;
  btnNow.setAttribute('aria-pressed', r); btnFast.setAttribute('aria-pressed', f);
  tlReal.style.display = r ? 'none' : '';   // la hora real solo se marca aparte cuando la escena va por otra hora
}
// regla del día: tramos, horas y medias horas
const ruler = document.getElementById('ruler'), tlNow = document.getElementById('tlNow'), tlReal = document.getElementById('tlReal');
const hhmm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(Math.floor(m % 60)).padStart(2, '0');
{
  const add = (cls, min, text) => { const e = document.createElement('div'); e.className = cls; e.style.left = (min / 1440 * 100) + '%'; if (text) e.textContent = text; ruler.insertBefore(e, tlReal); };
  for (let h = 0; h <= 24; h++) add('tk' + (h % 4 ? '' : ' key'), h * 60);
  for (let h = 0; h < 24; h += 4) add('hr', h * 60, String(h).padStart(2, '0') + ':00');   // seis horas clave
}
slider.addEventListener('input', () => { simMin = +slider.value; setMode(false, false); });
slider.addEventListener('change', () => slider.blur());   // devuelve las flechas al paseo
btnNow.addEventListener('click', () => setMode(true, false));
btnFast.addEventListener('click', () => { if (real) simMin = valenciaMinutes(new Date()); setMode(false, !fast); });
// pantalla completa (botón o tecla F) y ocultar los controles (tecla H)
const btnFull = document.getElementById('btnFull');
const toggleFull = () => { const el = document.documentElement; if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document); else (el.requestFullscreen || el.webkitRequestFullscreen).call(el); };
btnFull.addEventListener('click', () => { toggleFull(); btnFull.blur(); });
addEventListener('keydown', e => {
  if (e.code === 'KeyF') toggleFull();
  if (e.code === 'KeyH') for (const id of ['panel', 'weather']) { const el = document.getElementById(id); el.style.display = el.style.display === 'none' ? '' : 'none'; }
});

// sonido ambiente: apagado hasta que se pulsa el botón

function treeTexture() {
  const c = document.createElement('canvas'); c.width = 2048; c.height = 256;

    const gr = g.createRadialGradient(x - rx * 0.3, y - ry * 0.45, 1, x, y, Math.max(rx, ry));
    gr.addColorStop(0, `rgb(${l + 45},${l + 45},${l + 45})`); gr.addColorStop(1, `rgb(${l - 75},${l - 75},${l - 75})`);
    g.fillStyle = gr; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, 6.283); g.fill();
  };
  g.fillStyle = 'rgb(105,105,105)'; g.fillRect(0, 232, 2048, 24);
  for (let i = 0; i < 560; i++) {
    const x0 = Math.random() * 2048, k = Math.random(), l = rnd(140, 200), a = Math.random(), b = Math.random();
    for (const x of [x0, x0 - 2048, x0 + 2048]) {
      if (k < 0.55) {
        const r = 14 + a * 30;
        crown(x, 240 - r * 0.8, r, r * 0.8, l); crown(x + r * 0.6, 244 - r * 0.6, r * 0.7, r * 0.6, l - 15); crown(x - r * 0.5, 246 - r * 0.5, r * 0.6, r * 0.5, l - 10);
      } else if (k < 0.76) {
        const hgt = 70 + a * 70, r = 20 + b * 22;
        g.fillStyle = 'rgb(70,70,70)'; g.fillRect(x - 2, 250 - hgt, 4, hgt);
        crown(x, 250 - hgt, r, r * 0.42, l);
      } else if (k < 0.90) {
        const hgt = 80 + a * 90;
        crown(x, 250 - hgt * 0.5, 7 + b * 6, hgt * 0.5, l - 10);
      } else crown(x, 244, 26 + a * 30, 12 + b * 8, l - 20);
    }

}

    for (let j = 0; j <= M; j++) {
      const a = j / M * Math.PI * 2, sy = Math.sin(a);
      pos.push(r * 0.78 * Math.cos(a), r * sy, 0.5 - u);
      const c = sy > 0 ? mix3(flank, back, smooth(0.15, 0.6, sy)) : mix3(flank, belly, smooth(0.2, 0.75, -sy));
      colr.push(...c);
    }
  }
  for (let i = 0; i < N; i++) for (let j = 0; j < M; j++) { const a = i * (M + 1) + j, b = a + M + 1; idx.push(a, b, a + 1, b, b + 1, a + 1); }
  const fin = (pts, c) => { const k = pos.length / 3; for (const q of pts) { pos.push(...q); colr.push(...c); } idx.push(k, k + 1, k + 2); };
  fin([[0, 0.02, -0.49], [0, 0.17, -0.74], [0, 0, -0.60]], [0.20, 0.23, 0.23]);     // cola ahorquillada
  fin([[0, -0.02, -0.49], [0, 0, -0.60], [0, -0.17, -0.74]], [0.20, 0.23, 0.23]);
  fin([[0, 0.10, 0.14], [0, 0.185, 0.02], [0, 0.10, -0.02]], [0.16, 0.19, 0.19]);    // dorsales
  fin([[0, 0.075, -0.20], [0, 0.135, -0.30], [0, 0.06, -0.33]], [0.16, 0.19, 0.19]);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.Float32BufferAttribute(colr, 3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
})();
function fishMesh() {
  const m = new THREE.MeshStandardMaterial({ vertexColors: true, metalness: 0.55, roughness: 0.28, side: THREE.DoubleSide }), bend = { value: 0 };
  m.onBeforeCompile = sh => { sh.uniforms.uBend = bend; sh.vertexShader = 'uniform float uBend;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n float zz = 0.5 - position.z; transformed.x += uBend * zz * zz;'); };
  const mesh = new THREE.Mesh(fishGeo, m); mesh.rotation.order = 'YXZ'; mesh.visible = false; scene.add(mesh);
  return { mesh, bend, j: null };
}
const jumpers = [fishMesh(), fishMesh(), fishMesh()];

// gotas de las salpicaduras
const ND = 240, dropPos = new Float32Array(ND * 3).fill(-50), drops = Array.from({ length: ND }, () => ({ on: false, vx: 0, vy: 0, vz: 0 }));
const dropGeo = new THREE.BufferGeometry(); dropGeo.setAttribute('position', new THREE.BufferAttribute(dropPos, 3));
const dropMat = new THREE.PointsMaterial({ size: 0.022, transparent: true, opacity: 0.85, depthWrite: false });
const dropPts = new THREE.Points(dropGeo, dropMat); dropPts.frustumCulled = false; scene.add(dropPts);
let dropIdx = 0;
const dropTint = new THREE.Color();
function splashDrops(x, z, n, power, dx = 0, dz = 0) {
  for (let k = 0; k < n; k++) {
    const i = dropIdx++ % ND, d = drops[i], a = rnd(0, 6.283), sp = rnd(0.25, 1.4) * power;
    d.on = true; d.vx = Math.cos(a) * sp + dx; d.vz = Math.sin(a) * sp + dz; d.vy = rnd(1.0, 2.9) * power;
    dropPos[i * 3] = x + rnd(-0.05, 0.05); dropPos[i * 3 + 1] = 0.02; dropPos[i * 3 + 2] = z + rnd(-0.05, 0.05);
  }
}

const fish = { next: 4, idx: 0, pending: [] };
function ripple(x, z, t) { water.material.uniforms.ripples.value[fish.idx++ % 6].set(x, z, t); }
const fishSpot = () => { let x = 0, z = -10; for (let k = 0; k < 12; k++) { const D = 4 + 30 * Math.pow(Math.random(), 1.6); x = rnd(-0.55, 0.55) * D; z = EYE.z - D; if (groundY(x, z) < -0.2) break; } return [x, z]; };
// kind: 'jump' salto alto, 'skip' salto tendido, 'roll' el lomo asomando
function launchFish(x, z, yaw, kind, t, size, count = 0) {
  const f = jumpers.find(q => !q.j); if (!f) return;
  const h = kind === 'jump' ? rnd(0.28, 0.7) : kind === 'skip' ? rnd(0.10, 0.22) : rnd(0.045, 0.08);
  const dur = kind === 'roll' ? rnd(0.8, 1.1) : 2 * Math.sqrt(2 * h / 9.8);
  const len = kind === 'jump' ? rnd(0.5, 1.2) : kind === 'skip' ? rnd(0.9, 1.7) : rnd(0.35, 0.55);
  f.j = { x, z, yaw, kind, t0: t, h, dur, len, size, count, twist: kind === 'jump' ? rnd(-1.5, 1.5) : rnd(-0.3, 0.3) };
  f.mesh.scale.setScalar(size); f.mesh.visible = true;
  ripple(x, z, t);
  if (kind !== 'roll') splashDrops(x, z, Math.round(9 + size * 20), 0.75, Math.sin(yaw) * 0.5, Math.cos(yaw) * 0.5);
}
function fishEvent(t) {
  const [x, z] = fishSpot(), kind = Math.random();
  if (kind < 0.30) ripple(x, z, t);                                   // un pez que sube a comer
  else if (kind < 0.50) {                                             // varios seguidos en el mismo sitio
    const n = 2 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) fish.pending.push({ x: x + rnd(-0.9, 0.9), z: z + rnd(-0.9, 0.9), t: t + i * rnd(0.5, 1.4) });
  } else launchFish(x, z, rnd(0, 6.283), kind < 0.70 ? 'roll' : kind < 0.86 ? 'skip' : 'jump', t, rnd(0.22, 0.38));
}
function updateFish(t, dt, dayAmt) {
  if (t > fish.next) { fish.next = t + rnd(4, 13) * (1.6 - 0.6 * dayAmt); if (rain < 0.3) fishEvent(t); }
  for (let i = fish.pending.length - 1; i >= 0; i--) if (t >= fish.pending[i].t) { const p = fish.pending[i]; p.launch ? launchFish(...p.launch, t, p.size, p.count) : ripple(p.x, p.z, t); fish.pending.splice(i, 1); }
  for (const f of jumpers) {
    const j = f.j; if (!j) continue;
    const k = (t - j.t0) / j.dur, sx = Math.sin(j.yaw), cz = Math.cos(j.yaw);
    if (k >= 1) {
      const ex = j.x + sx * j.len, ez = j.z + cz * j.len;
      ripple(ex, ez, t);
      if (j.kind !== 'roll') { ripple(ex + 0.06, ez, t + 0.12); splashDrops(ex, ez, Math.round(16 + j.size * 40 + j.h * 20), 0.8 + j.h * 0.7, sx * 0.6, cz * 0.6); }
      // las llisas suelen encadenar dos o tres saltos
      if (j.kind !== 'roll' && j.count < 2 && Math.random() < 0.45) fish.pending.push({ t: t + rnd(0.25, 0.55), launch: [ex + sx * 0.25, ez + cz * 0.25, j.yaw + rnd(-0.25, 0.25), 'skip'], size: j.size, count: j.count + 1 });
      f.j = null; f.mesh.visible = false; continue;
    }
    f.mesh.position.set(j.x + sx * j.len * k, 4 * j.h * k * (1 - k) - 0.06 * j.size * 3, j.z + cz * j.len * k);
    f.mesh.rotation.set(-Math.atan2(4 * j.h * (1 - 2 * k), j.len), j.yaw, j.twist * k);
    f.bend.value = j.kind === 'roll' ? 0.22 * Math.sin(t * 9) : 0.38 * Math.sin(t * 40 + j.t0);
  }
  // gotas
  for (let i = 0; i < ND; i++) {
    const d = drops[i]; if (!d.on) continue;
    d.vy -= 9.8 * dt; dropPos[i * 3] += d.vx * dt; dropPos[i * 3 + 1] += d.vy * dt; dropPos[i * 3 + 2] += d.vz * dt;
    if (dropPos[i * 3 + 1] < 0) { d.on = false; dropPos[i * 3 + 1] = -50; }
  }
  dropGeo.attributes.position.needsUpdate = true;
  dropMat.color.copy(hemi.color).multiplyScalar(0.9 * hemi.intensity).add(dropTint.copy(sunLight.color).multiplyScalar(0.25 * sunLight.intensity));
}

// peces que nadan a ras de superficie: aleta fuera, cola batiendo y estela en V; a veces van en grupo
const finGeo = new THREE.BufferGeometry();
finGeo.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, 0.06, 0, 0.045, -0.02, 0, 0, -0.07], 3)); finGeo.computeVertexNormals();
const tailGeo = new THREE.BufferGeometry();
tailGeo.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, 0, 0, 0.035, -0.09, 0, 0, -0.07], 3)); tailGeo.computeVertexNormals();
const finMat = new THREE.MeshStandardMaterial({ color: 0x242a29, roughness: 0.35, metalness: 0.3, side: THREE.DoubleSide });
const trailFish = [null, null, null, null], trailNext = [8, 22, 40, 60];
const trailFins = trailFish.map(() => { const g = new THREE.Group(), tail = new THREE.Mesh(tailGeo, finMat); tail.position.z = -0.20; g.add(new THREE.Mesh(finGeo, finMat), tail); g.visible = false; scene.add(g); return { g, tail }; });
function startTrail(i, x, z, ang, t, v) { trailFish[i] = { x, z, ang, v, v0: v, t0: t, dur: rnd(6, 15), turn: rnd(-0.12, 0.12), spurtAt: t + rnd(2, 8), size: rnd(0.8, 1.3) }; }
function updateTrails(t, dt) {
  const tv = water.material.uniforms.trails.value;
  for (let i = 0; i < 4; i++) {
    const f = trailFish[i], fin = trailFins[i];
    if (!f) {
      tv[i].w = 0; fin.g.visible = false;
      if (t > trailNext[i] && rain < 0.3) {
        const D = rnd(4, 24), x = rnd(-0.5, 0.5) * D, z = EYE.z - D, ang = (Math.random() < 0.5 ? 0 : Math.PI) + rnd(-0.6, 0.6), v = rnd(0.45, 1.0);
        if (groundY(x, z) < -0.3) {
          startTrail(i, x, z, ang, t, v);
          // grupo: los huecos libres se suman en paralelo
          if (Math.random() < 0.3) for (let k = 0; k < 4; k++) if (!trailFish[k] && Math.random() < 0.7) { const o = rnd(0.5, 1.4) * (k % 2 ? 1 : -1); startTrail(k, x - Math.sin(ang) * o + rnd(-0.8, 0.8), z + Math.cos(ang) * o, ang + rnd(-0.1, 0.1), t + rnd(0, 0.8), v * rnd(0.9, 1.1)); }
        } else trailNext[i] = t + 1;
      }

    }
    const age = t - f.t0; if (age < 0) continue;
    if (t > f.spurtAt) { f.spurtAt = t + rnd(3, 9); f.v = f.v0 * rnd(1.8, 2.8); f.turn = rnd(-0.5, 0.5); }   // arrancada
    f.v += (f.v0 - f.v) * Math.min(1, 0.9 * dt);
    f.ang += (f.turn + 0.15 * Math.sin(t * 0.7 + i * 3)) * dt; f.turn *= 1 - Math.min(1, 0.4 * dt);
    f.x += Math.cos(f.ang) * f.v * dt; f.z += Math.sin(f.ang) * f.v * dt;
    if (rain > 0.3) f.dur = Math.min(f.dur, age + 1.5);   // con lluvia se hunden
    if (age > f.dur || groundY(f.x, f.z) > -0.2) {
      const r = rain > 0.3 ? 1 : Math.random();   // se hunde con un remolino, o remata con un salto
      if (r < 0.35) launchFish(f.x, f.z, Math.atan2(Math.cos(f.ang), Math.sin(f.ang)), r < 0.2 ? 'skip' : 'jump', t, rnd(0.24, 0.36));

      trailFish[i] = null; trailNext[i] = t + rnd(10, 34); continue;
    }
    const k = smooth(0, 1.2, age) * (1 - smooth(f.dur - 1.5, f.dur, age));
    tv[i].set(f.x, f.z, f.ang, k * (0.45 + 0.55 * f.v));
    const up = k * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 0.9 + i * 2)));   // la aleta asoma y se sumerge
    fin.g.visible = up > 0.2;
    fin.g.position.set(f.x, -0.045 * f.size * (1 - up), f.z); fin.g.rotation.y = Math.atan2(Math.cos(f.ang), Math.sin(f.ang)); fin.g.scale.setScalar(f.size);
    fin.tail.rotation.y = 0.6 * Math.sin(t * (5 + 4 * f.v) + i);
  }
}

// ---------- vegetación ----------
function patchPlant(mat, height) {
  mat.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, { uTime: U.time, uWind: U.wind, uH: { value: height }, uSunView: U.sunView, uSunCol: U.sunCol });
    sh.vertexShader = 'uniform float uTime, uWind, uH;\n' + sh.vertexShader.replace('#include <project_vertex>', `
      vec4 mvPosition = vec4(transformed, 1.0);
      #ifdef USE_INSTANCING
        mvPosition = instanceMatrix * mvPosition;
        float hf = clamp(position.y / uH, 0.0, 1.0);
        vec2 wp = instanceMatrix[3].xz;
        float sc = length(instanceMatrix[1].xyz);
        // rachas que recorren el carrizal, vaivén lento de toda la mata, cimbreo del tallo y temblor de cada hoja
        float gust = 0.5 + 0.5 * sin(wp.x * 0.11 + wp.y * 0.07 - uTime * 1.15);
        gust *= 0.55 + 0.45 * sin(wp.x * 0.031 - wp.y * 0.043 + uTime * 0.31);
        float big = sin(uTime * 0.55 + wp.x * 0.05 + wp.y * 0.03) * 0.40;
        float fl = sin(uTime * 2.9 + wp.x * 1.3 + wp.y * 1.7) * 0.32 + sin(uTime * 6.3 + position.x * 60.0 + position.y * 40.0 + wp.y) * 0.14 * hf;
        float side = sin(uTime * 1.7 + wp.x * 0.9 + wp.y * 0.6) * 0.28;
        vec2 off = (vec2(0.95, 0.3) * (uWind * (0.30 + 0.80 * gust) + big * uWind + fl * uWind * 0.7) + vec2(-0.3, 0.95) * side * uWind) * hf * hf * uH * sc * 0.25;
        mvPosition.xz += off;
        mvPosition.y -= length(off) * 0.30 * hf;
      #endif
      mvPosition = modelViewMatrix * mvPosition;
      gl_Position = projectionMatrix * mvPosition;`);
    sh.fragmentShader = 'uniform vec3 uSunView, uSunCol;\n' + sh.fragmentShader.replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      { float bl = pow(max(dot(-normalize(vViewPosition), uSunView), 0.0), 4.0); totalEmissiveRadiance += diffuseColor.rgb * uSunCol * (bl * 0.22 + 0.10); }`);
  };
}


async function buildPlants() {
  const [g1, g2] = await Promise.all([loadGLTF('assets/grass_medium_01/grass_medium_01.gltf'), loadGLTF('assets/grass_medium_02/grass_medium_02.gltf')]);
  reseed(1);   // los modelos llegan en orden variable: cada parte siembra por su cuenta
  const meshes = {};
  for (const g of [g1, g2]) g.scene.traverse(o => { if (o.isMesh) meshes[o.name] = o; });
  const find = key => { const k = Object.keys(meshes).find(n => n.includes(key)); if (!k) console.error('falta', key, Object.keys(meshes)); return meshes[k]; };
  const dummy = new THREE.Object3D(), col = new THREE.Color();

  function instanced(key, list, shadows) {
    const src = find(key); if (!src || !list.length) return;
    const geo = src.geometry; geo.computeBoundingBox();
    const h = geo.boundingBox.max.y;
    const mat = src.material.clone();
    Object.assign(mat, { transparent: false, alphaTest: 0.38, alphaToCoverage: true, side: THREE.DoubleSide, depthWrite: true });
    patchPlant(mat, h);
    const im = new THREE.InstancedMesh(geo, mat, list.length);
    list.forEach((p, i) => {
      dummy.position.set(p.x, p.y, p.z); dummy.rotation.set(rnd(-0.06, 0.06), rnd(0, 6.283), rnd(-0.06, 0.06));
      dummy.scale.set(p.s * (p.w || 1) * rnd(0.85, 1.15), p.s, p.s * (p.w || 1) * rnd(0.85, 1.15)); dummy.updateMatrix();
      im.setMatrixAt(i, dummy.matrix);
      const dry = Math.random();
      im.setColorAt(i, col.setRGB(mix(1.2, 2.0, dry) * p.t, mix(1.4, 1.6, dry) * p.t, mix(1.0, 0.7, dry) * p.t));
    });
    im.frustumCulled = false;
    if (shadows) {
      im.castShadow = true; im.receiveShadow = true;
      im.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: mat.map, alphaTest: 0.38 });
    }
    scene.add(im);
  }

  // Carrizo alto a los lados, dejando una ventana abierta al lago
  const tall = [[], [], []], sedge = [[], []];
  for (let i = 0; i < 16000 && tall[0].length + tall[1].length + tall[2].length < 5200; i++) {
    const x = rnd(-34, 34), z = rnd(-24, -2.6), D = EYE.z - z;
    const open = 1.5 + 0.30 * D + 1.6 * noise1(z * 0.4 + (x > 0 ? 9 : 40)) + (x < 0 ? 1.7 : 0);
    const edge = Math.abs(x) - open;
    if (edge < 0 || z < -21 + 5 * noise1(x * 0.3 + 5) || pierDist(x, z) < 1.15) continue;
    const dense = smooth(0, 2.5, edge);
    if (Math.random() > 0.35 + 0.65 * dense) continue;
    const y = Math.max(groundY(x, z), -0.25) - 0.05;
    tall[i % 3].push({ x, y, z, s: (6.5 + 5.5 * dense * rnd(0.6, 1)) * rnd(0.8, 1.2), w: 0.5, t: rnd(0.75, 1.05) });
  }
  // Islas de carrizo dentro del lago
  for (const [cx, cz, r] of [[-70, -95, 16], [95, -150, 22], [-180, -240, 30], [30, -260, 18], [210, -300, 34], [-25, -190, 10], [150, -70, 12]]) {
    for (let i = 0; i < r * 16; i++) {
      const a = rnd(0, 6.283), q = Math.sqrt(Math.random()) * r;
      tall[i % 3].push({ x: cx + Math.cos(a) * q * 1.8, y: -0.1, z: cz + Math.sin(a) * q * 0.7, s: rnd(7, 11) * (1 - 0.4 * q / r), w: 0.55, t: rnd(0.7, 1) });
    }
  }
  // Juncos bajos en primer término
  for (let i = 0; i < 4000 && sedge[0].length + sedge[1].length < 620; i++) {
    const x = rnd(-22, 22), z = rnd(-9, -1.6), D = EYE.z - z;
    if (Math.random() > 0.25 + 0.75 * noise1(x * 0.7 + z * 0.3 + 20)) continue;
    const y = groundY(x, z);
    if (y < -0.35) continue;
    if (pierDist(x, z) < 0.9) continue;
    const inside = Math.abs(x) < 0.7 + 0.36 * D + (x < 0 ? 1.8 : 0);
    if (inside && Math.random() > 0.05) continue;
    sedge[i % 2].push({ x, y: Math.max(y, -0.2) - 0.02, z, s: inside ? rnd(0.6, 1.1) : rnd(1.4, 3.0), t: rnd(0.8, 1.05) });
  }
  const tuftKeys = Object.keys(meshes).filter(k => /small|mid|tiny/.test(k) && meshes[k].geometry.index.count / 3 > 250 && meshes[k].geometry.index.count / 3 < 1700).slice(0, 4);
  const tufts = tuftKeys.map(() => []);
  for (let i = 0; i < 6000 && tufts.reduce((a, l) => a + l.length, 0) < 420 && tufts.length; i++) {
    const x = rnd(-13, 13), z = rnd(-3.4, 4.5), y = groundY(x, z);
    if (y < 0.07 || Math.random() > 0.15 + 0.85 * noise2(x * 0.9 + 30, z * 0.9) || (Math.abs(x) < 0.9 && Math.random() < 0.8)) continue;
    tufts[i % tufts.length].push({ x, y: y + groundBump(x, z) - 0.03, z, s: rnd(1.2, 2.4), t: rnd(0.8, 1.1) });
  }
  tuftKeys.forEach((k, i) => instanced(k, tufts[i], false));
  ['tall_a', 'tall_b', 'tall_c'].forEach((k, i) => instanced(k, tall[i], true));
  ['medium_02_e', 'medium_02_c'].forEach((k, i) => instanced(k, sedge[i], true));
}

// ---------- piedras, ramas y restos en la orilla ----------
const zAtHeight = (x, h) => { let a = -9, b = 2; for (let i = 0; i < 22; i++) { const m = (a + b) / 2; if (groundY(x, m) < h) a = m; else b = m; } return (a + b) / 2; };
async function buildDebris() {
  const [rk, br] = await Promise.all([loadGLTF('assets/rock_moss_set_01/rock_moss_set_01.gltf'), loadGLTF('assets/dry_branches_medium_01/dry_branches_medium_01.gltf')]);
  const pick = g => { const o = []; g.scene.traverse(m => { if (m.isMesh) o.push(m); }); return o.sort((a, b) => a.name.localeCompare(b.name)); };
  reseed(2);
  const rocks = pick(rk), branches = pick(br);
  const d = new THREE.Object3D(), col = new THREE.Color();
  const inst = (geo, mat, list, tint) => {
    const im = new THREE.InstancedMesh(geo, mat, list.length);
    list.forEach((p, i) => {
      d.position.set(p.x, p.y, p.z); d.rotation.set(p.rx || 0, p.ry, p.rz || 0); d.scale.set(p.s, p.s * (p.sy || 1), p.s * (p.sz || 1)); d.updateMatrix();
      im.setMatrixAt(i, d.matrix);
      if (tint) im.setColorAt(i, tint(col));
    });
    im.castShadow = im.receiveShadow = true; im.frustumCulled = false; scene.add(im);
  };
  const clearOfCamera = (x, z) => !(Math.abs(x) < 0.7 && z > -1.9);

  // piedras medio enterradas a lo largo de la línea del agua
  const rockMat = rocks[0].material; rockMat.color.set(0xb4aa9a);
  const rockSets = [rocks[2], rocks[5], rocks[0]], lists = [[], [], []];
  for (let i = 0; i < 54; i++) {
    const x = rnd(-10, 10), z = zAtHeight(x, 0) + rnd(-1.7, 1.0), s = 0.035 + 0.26 * Math.pow(Math.random(), 2.4);
    if (!clearOfCamera(x, z)) continue;
    lists[i % 3].push({ x, y: Math.max(groundY(x, z), -0.25) - s * 0.25, z, s, sy: rnd(0.55, 0.9), ry: rnd(0, 6.283), rx: rnd(-0.2, 0.2), rz: rnd(-0.2, 0.2) });
  }
  rockSets.forEach((r, i) => inst(r.geometry, rockMat, lists[i]));

  camera.position.set(walk.x + 0.012 * Math.sin(t * 0.21), y + 0.006 * Math.sin(t * 0.33 + 1), walk.z);
  const a = walk.yaw + 0.003 * Math.sin(t * 0.07);
  camera.lookAt(camera.position.x + Math.sin(a) * 24, camera.position.y + 24 * Math.tan(-0.104 + walk.pitch), camera.position.z - Math.cos(a) * 24);
}

// ---------- bucle ----------
const sunNdc = new THREE.Vector3(), fwd = new THREE.Vector3(0, 0, -1);
const doy = Math.floor((Date.now() - Date.UTC(new Date().getUTCFullYear(), 0, 0)) / 86400000);
const srgb = (c, a) => c.setRGB(a[0], a[1], a[2], THREE.SRGBColorSpace);
const timer = new THREE.Clock();
let cloudClock = valenciaMinutes(new Date()) * 60;
function frame() {
  const dt = Math.min(0.1, timer.getDelta()), t = timer.elapsedTime;
  if (fast) simMin = (simMin + dt * 12) % 1440;
  const m = real ? valenciaMinutes(new Date()) : simMin;
  if (real || fast) slider.value = Math.floor(m);
  clock.textContent = hhmm(m); tlNow.style.left = (m / 1440 * 100) + '%';
  if (!real) { const rm = valenciaMinutes(new Date()); tlReal.style.left = (rm / 1440 * 100) + '%'; tlReal.title = 'Hora real: ' + hhmm(rm); }

  const { sun, moon } = sky(sceneDate());
  dirOf(sun.az, sun.el, sunDir); dirOf(moon.az, moon.el, moonDir);
  const el = sun.el;
  const day = smooth(-0.20, 0.10, el), tw = Math.exp(-Math.pow(el / (el > 0 ? 0.22 : 0.14), 2)), glow = 0.42 + 0.58 * smooth(-0.18, 0.03, el);
  const gust = 0.6 + 0.3 * Math.sin(t * 0.05) + 0.2 * Math.sin(t * 0.013 + 2);
  const wind = windReal === null ? clamp(gust, 0.25, 1.1) : clamp(windReal / 18, 0.12, 2.0) * (0.55 + 0.75 * gust);   // 18 km/h ≈ la brisa de siempre
  rain += (rainT - rain) * Math.min(1, 0.4 * dt); if (Math.abs(rainT - rain) < 0.002) rain = rainT;
  bare += (bareT - bare) * Math.min(1, 0.25 * dt); if (Math.abs(bareT - bare) < 0.002) bare = bareT;
  cover += (coverT - cover) * Math.min(1, 0.25 * dt);
  // cielo cubierto sin llover: techo gris y luz difusa, pero sin gotas ni charcos
  const over = Math.max(rain, 0.85 * smooth(0.82, 1.0, cover) * (1 - bare));
  U.time.value = t; U.wind.value = wind * (1 + 0.7 * rain); U.rain.value = rain;
  skyMat.uniforms.uRain.value = over;
  skyMat.uniforms.uMoonPhase.value = moon.phase;
  // El reloj de las nubes sigue la hora real, así el cielo continúa donde estaba al volver a entrar
  cloudClock += dt * (fast ? 45 : 1);
  skyMat.uniforms.uC.value = cloudClock;
  skyMat.uniforms.uCloud.value = mix(0.62, 0.30, cover) + (weatherMode === 'real' ? 0 : 0.14 * (noise1(cloudClock / 3600 * 0.9 + doy * 7.3) - 0.5)) + 0.02 * Math.sin(cloudClock * 0.004) + 0.60 * bare;   // el umbral baja con la nubosidad; con cielo raso sube hasta que no queda ninguna nube

  // luz principal: sol, o luna cuando es de noche
  const sunI = 3.6 * smooth(-0.03, 0.22, el) * (1 - 0.88 * rain - 0.50 * (over - rain)) * (1 - 0.35 * smooth(0.5, 0.85, cover) * (1 - bare));
  const moonI = 0.22 * moon.phase * smooth(0, 0.15, moon.el) * (1 - day) * (1 - 0.8 * rain);
  sunLight.shadow.intensity = 0.8 * (1 - over);
  const useSun = sunI >= moonI;
  lightDir.copy(useSun ? sunDir : moonDir);
  if (lightDir.y < 0.02) { lightDir.y = 0.02; lightDir.normalize(); }
  if (useSun) srgb(sunLight.color, mix3([1.0, 0.50, 0.20], [1.0, 0.96, 0.88], smooth(0, 0.35, el))); else srgb(sunLight.color, [0.62, 0.72, 1.0]);
  sunLight.intensity = Math.max(sunI, moonI);
  sunLight.target.position.set(0, 0, -6);
  sunLight.position.copy(sunLight.target.position).addScaledVector(lightDir, 120);

  const toward = Math.pow(fwd.dot(sunDir) * 0.5 + 0.5, 3);
  const s0 = mix3([1.0, 0.34, 0.10], [1.0, 0.56, 0.22], smooth(0.02, 0.20, el));
  const g0 = mix3([0.62, 0.50, 0.54], s0, Math.pow(fwd.dot(sunDir) * 0.5 + 0.5, 1.6)).map(v => v * glow);
  const grey = [0.55, 0.575, 0.61].map(v => v * (0.10 + 0.90 * day) * (1 - 0.2 * tw));
  const hor = mix3(mix3(mix3([0.070, 0.100, 0.185], [0.74, 0.85, 0.93], day), g0, tw * 0.9), grey, over * 0.96);
  const zen = mix3(mix3(mix3([0.022, 0.034, 0.085], [0.17, 0.38, 0.74], day), [0.42, 0.50, 0.64].map(v => v * (0.5 + 0.5 * smooth(-0.14, 0.02, el))), tw * 0.55), grey.map(v => v * 0.8), over * 0.96);
  scene.fog.density = 0.00028 + 0.0016 * rain;
  srgb(scene.fog.color, hor);
  srgb(hemi.color, mix3(zen, hor, 0.45)); srgb(hemi.groundColor, mix3([0.02, 0.03, 0.03], [0.20, 0.19, 0.14], day));
  hemi.intensity = (0.45 + 1.3 * day) * (1 + 0.8 * rain + 1.6 * (over - rain)) + 0.9 * tw * (1 - over);   // un día cubierto y seco es luminoso: toda la luz viene del cielo   // luz de relleno en la puesta: la orilla a contraluz no se queda en negro
  srgb(U.horCol.value, hor);
  for (const r of ridges) {
    const dark = mix3([0.02, 0.03, 0.06], r.tint, day).map(v => v * (1 - tw * 0.45));
    srgb(r.mat.uniforms.uTop.value, mix3(hor, dark, r.k * (1 - rain))); srgb(r.mat.uniforms.uBase.value, mix3(hor, dark, r.k * 0.82 * (1 - rain)));
    r.mat.uniforms.uAlpha.value = 1 - smooth(0.15, 0.75, rain);   // con lluvia la sierra se pierde tras la cortina de agua, no se recorta en blanco
  }
  // La arboleda y el carrizo de la otra orilla son lo más cercano del fondo: más oscuros que la sierra, apenas velados.
  // Solo la lluvia los funde con la bruma.
  const veil = 0.12 + 0.86 * smooth(0.1, 0.7, rain);
  const treeDark = mix3([0.018, 0.026, 0.045], [0.085, 0.125, 0.080], day).map(v => v * (1 - tw * 0.45));
  srgb(treeMat.color, mix3(treeDark, hor, veil));
  srgb(beltMat.color, mix3(mix3([0.022, 0.028, 0.045], [0.20, 0.185, 0.10], day).map(v => v * (1 - tw * 0.45)), hor, veil + 0.04));
  renderer.toneMappingExposure = 0.62 + 2.4 * (1 - smooth(-0.30, -0.08, el)) + 0.16 * tw;
  townMat.opacity = (1 - smooth(-0.04, 0.10, el)) * (1 - rain);
  townMat.color.setRGB(1.5, 1.0, 0.5).multiplyScalar(0.62 / renderer.toneMappingExposure);

  const wu = water.material.uniforms;
  wu.time.value += dt * (0.35 + 0.5 * wind) * (1 + 0.25 * rain);
  waveAmt = Math.min(1.25, 0.10 + 0.90 * rain + 0.45 * Math.max(0, wind - 0.9)); wu.uWave.value = waveAmt;   // el viento solo también levanta oleaje
  wu.uT.value = t;
  wu.foamCol.value.copy(hemi.color).multiplyScalar(0.25 + 0.5 * day);
  wu.sunDirection.value.copy(lightDir);
  wu.sunColor.value.copy(sunLight.color).multiplyScalar((useSun ? 1.5 * smooth(-0.03, 0.10, el) : moonI * 5) * (1 - 0.9 * rain));
  srgb(wu.waterColor.value, mix3([0.010, 0.020, 0.030], [0.10, 0.19, 0.14], day));
  wu.distortionScale.value = 1.4 + 1.6 * wind + 1.5 * rain;
  wu.uRain.value = rain;
  rainLines.visible = rain > 0.01; rainMat.uniforms.uCam.value.copy(camera.position);
  srgb(rainMat.uniforms.uCol.value, [0.78, 0.82, 0.88].map(v => v * (0.12 + 0.88 * day)));

  U.sunView.value.copy(lightDir).transformDirection(camera.matrixWorldInverse);
  U.sunCol.value.copy(sunLight.color).multiplyScalar(sunLight.intensity * 0.5);
  bloom.strength = (0.28 + 0.16 * tw) * (1 - 0.6 * rain);
  renderer.toneMappingExposure *= 1 + 0.10 * rain + 0.45 * (over - rain);
  sunNdc.copy(camera.position).addScaledVector(sunDir, 1000).project(camera);
  rays.uniforms.uSun.value.set(sunNdc.x * 0.5 + 0.5, sunNdc.y * 0.5 + 0.5);
  rays.uniforms.uAmt.value = sunNdc.z < 1 && Math.abs(sunNdc.x) < 1.6 ? 0.55 * smooth(-0.06, 0.03, el) * (1 - rain) : 0;

  updateWalk(t, dt);
  if (window.__dbg) { camera.position.fromArray(window.__dbg.p); camera.lookAt(...window.__dbg.l); }
  dome.position.copy(camera.position);

  const chop = 1 + 2.4 * rain;
  for (const b of moored) {
    b.g.position.y = waveY(b.g.position.x, b.g.position.z, t) * 0.8 + 0.008 * Math.sin(t * 0.8 + b.ph);
    b.g.rotation.set(0.008 * chop * Math.sin(t * (0.6 + 0.6 * rain) + b.ph), b.ry + 0.02 * Math.sin(t * 0.11 + b.ph), 0.02 * chop * Math.sin(t * (0.5 + 0.7 * rain) + b.ph * 2));
    if (b.people) { b.g.visible = rain < 0.5; for (const pp of b.people) animatePerson(pp, t, dt); }   // los que pescaban fondeados se recogen
  }
  if (boatKit.ready && !traffic.started) { traffic.started = true; for (const pr of [0.35, 0.6]) spawnBoat(day, pr); }
  if (boatKit.ready && t > nextBoat) { nextBoat = t + rnd(20, 50) / (0.25 + 0.75 * day); spawnBoat(day); }
  for (let i = traffic.length - 1; i >= 0; i--) {
    const o = traffic[i];
    o.x += o.dir * o.v * dt * (1 + 3 * smooth(0.2, 0.6, rain));   // si empieza a llover, aprietan para salir
    const wob = o.x * 0.02 + o.ph;
    const oz = o.z0 + 2.5 * Math.sin(wob);
    o.g.position.set(o.x, waveY(o.x, oz, t) * 0.8 + 0.008 * Math.sin(t * 0.9 + o.ph), oz);
    o.g.rotation.set(0.01 * chop * Math.sin(t * (0.7 + 0.6 * rain) + o.ph), o.dir * (Math.PI / 2 - 0.05 * Math.cos(wob)), (o.heel || 0) + 0.02 * chop * Math.sin(t * (0.6 + 0.7 * rain) + o.ph * 2));
    const push = Math.sin(t * 0.8 + o.ph);
    if (o.pole) o.pole.rotation.x = 0.30 + 0.32 * push;
    for (const pp of o.people) animatePerson(pp, t, dt, pp === o.poler ? push : undefined);
    if (Math.abs(o.x) > o.limit) { scene.remove(o.g); traffic.splice(i, 1); }
  }
  const dark = 1 - smooth(-0.06, 0.08, el);
  boatKit.lanternMat.color.setRGB(5.0, 3.0, 1.2).multiplyScalar(dark * 0.62 / renderer.toneMappingExposure);
  boatKit.wakeMat.color.copy(hemi.color).multiplyScalar(0.10 + 0.55 * day);
  boatKit.sailMat.emissive.copy(sunLight.color).multiplyScalar(0.05 * sunLight.intensity * (useSun ? 1 : 0.3));

  updateFish(t, dt, day);
  updatePlaque(t);
  birdLife.update(t, dt, day, tw, rain);
  sound.update(t, day, tw, rain, wind);
  surfaceLife.update(t, dt, day * (1 - rain), tw, wind * (1 + 0.7 * rain), sunLight.color, rain);   // con lluvia no salen insectos
  updateTrails(t, dt);

  if (t > nextFlock) { nextFlock = t + rnd(80, 190) * (1 - 0.4 * tw); spawnFlock(day); }
  for (let i = flocks.length - 1; i >= 0; i--) {
    const f = flocks[i];
    f.group.position.x += f.dir * f.v * dt; f.group.position.y += f.drift * dt;
    for (const mx of f.mixers) mx.update(dt);
    if (Math.abs(f.group.position.x) > f.limit) { scene.remove(f.group); flocks.splice(i, 1); }
  }

  finish.uniforms.uTexel.value.set(1 / (innerWidth * pixelRatio), 1 / (innerHeight * pixelRatio));
  composer.render();
  watchPerformance();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__scene = { scene, camera, renderer, flocks, birdSrc, traffic, fishEvent, ripple, timer, boatKit, trailFish, water, birdLife, walk, keys, launchFish, startTrail, sound };
